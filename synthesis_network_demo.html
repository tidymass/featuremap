<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthesis Network</title>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
     background:#f4f5f7;color:#1c1f26;font-size:14px;line-height:1.55}

.page-header{background:#519d9e;color:#fff;padding:20px 30px 18px}
.page-header h1{font-size:1.15rem;font-weight:600;letter-spacing:-.01em}
.page-header .sub{font-size:.8rem;color:rgba(255,255,255,.82);margin-top:4px}

.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);
        align-items:stretch;gap:14px;max-width:1360px;margin:0 auto;padding:18px 18px 0}
.panel{background:#fff;border:1px solid #dbe5f2;border-radius:10px;overflow:hidden}
.network-panel{display:flex;flex-direction:column;min-height:0}

/* toolbar + legend */
.toolbar{padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
         border-bottom:1px solid #eef0f4}
.toolbar label{font-size:.78rem;color:#4b5563;display:flex;align-items:center;gap:5px;
               cursor:pointer}
.toolbar input[type=text]{border:1px solid #d8dde6;border-radius:6px;padding:5px 9px;
                          min-width:210px;font-size:.82rem;outline:none}
.toolbar input[type=text]:focus{border-color:#3966a2}
.legend{padding:8px 14px;display:flex;gap:8px 13px;flex-wrap:wrap;color:#6b7280;font-size:.73rem;
        border-bottom:1px solid #eef0f4;align-items:center;overflow:visible}
.legend span{display:inline-flex;align-items:center;gap:4px}
.leg-circle{width:11px;height:11px;border-radius:50%;background:#667085;flex-shrink:0}
.leg-edge-biochem{width:18px;height:0;border-top:2px dashed #2f9e6a;flex-shrink:0}
.leg-edge-biology{width:18px;height:0;border-top:2px dashed #c1602e;flex-shrink:0}
.leg-edge-both{width:18px;height:2px;background:#3966a2;flex-shrink:0}
.leg-sep{width:1px;height:11px;background:#d1d5db}
#cluster-legend{display:flex;gap:5px 10px;flex:1 0 100%;min-width:0;
                flex-wrap:wrap;overflow:visible;white-space:normal}
.cluster-filter{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;
                border:0;background:transparent;color:#6b7280;font:inherit;
                cursor:pointer;padding:2px 1px}
.cluster-filter:hover,.cluster-filter.active{color:#1f2937}
.cluster-filter.active{font-weight:600}
.cluster-filter.dimmed{opacity:.36}
.cluster-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* network SVG */
.network-wrap{position:relative;overflow:hidden;min-height:500px;height:auto;flex:1}
svg{width:100%;height:100%;display:block;background:#fbfcfe}
.edge{stroke-opacity:.65}
.edge.biochemical{stroke:#2f9e6a;stroke-width:1.8;stroke-dasharray:5 4}
.edge.biology{stroke:#c1602e;stroke-width:1.8;stroke-dasharray:5 4}
.edge.both{stroke:#3966a2;stroke-width:2.6}
.node{cursor:default}
.node text{font-size:10.5px;fill:#1f2937;paint-order:stroke;stroke:#fbfcfe;
           stroke-width:2.5px;user-select:none;pointer-events:none}

/* compact index for hypotheses without links */
.unlinked{border-top:1px solid #eef0f4;background:#fff}
.unlinked-toggle{width:100%;border:0;background:#fff;padding:9px 14px;
                 display:flex;align-items:center;gap:8px;text-align:left;
                 color:#4b5563;font-size:.76rem;font-weight:600;cursor:pointer}
.unlinked-toggle:hover{background:#fafbfc}
.unlinked-count{color:#8b909e;font-weight:500}
.unlinked-chevron{margin-left:auto;color:#9ca3af;transition:transform .16s ease}
.unlinked.open .unlinked-chevron{transform:rotate(180deg)}
.unlinked-body{display:none;padding:3px 14px 12px}
.unlinked.open .unlinked-body{display:block}
.unlinked-group{display:grid;grid-template-columns:minmax(150px,230px) 1fr;
                gap:10px;padding:7px 0;border-top:1px solid #f1f3f5}
.unlinked-group:first-child{border-top:0}
.unlinked-cluster{display:flex;align-items:center;gap:6px;min-width:0;
                  color:#667085;font-size:.72rem}
.unlinked-cluster span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unlinked-nodes{display:flex;align-items:center;gap:7px 14px;flex-wrap:wrap}
.unlinked-node{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;
               color:#374151;font-size:.72rem;cursor:pointer;padding:1px 0}
.unlinked-node:hover{color:#1f2937}
.unlinked-node.dimmed{opacity:.22}
.unlinked-node-dot{display:inline-block;border-radius:50%;flex:0 0 auto;
                   border:1.5px solid #fff;box-shadow:0 0 0 1px #dfe3e8}

/* hover tooltip — lightweight, title only, no pointer-events */
#tooltip{position:absolute;pointer-events:none;display:none;z-index:30;
         background:rgba(28,31,38,.82);color:#fff;
         padding:5px 10px;border-radius:6px;
         font-size:.76rem;font-weight:500;white-space:nowrap;
         max-width:260px;overflow:hidden;text-overflow:ellipsis;
         line-height:1.4}

/* pinned card — click to open, scrollable, pointer-events:auto */
#pinned{position:absolute;display:none;z-index:40;
        background:#fff;border:1px solid #d1d5db;border-radius:10px;
        box-shadow:0 6px 24px rgba(0,0,0,.16);
        width:270px;max-height:280px;flex-direction:column;overflow:hidden}

/* study-context pills in page header */
.ctx-pill{display:inline-flex;align-items:center;
          font-size:.75rem;padding:2px 10px;border-radius:20px;
          background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
          color:#fff;margin-right:5px}
#pinned .pin-hdr{padding:11px 13px 8px;border-bottom:1px solid #eef0f4;
                 display:flex;align-items:flex-start;gap:6px;flex-shrink:0}
#pinned .pin-id {font-size:.68rem;font-weight:700;color:#3966a2;
                 background:#eef4fb;padding:1px 6px;border-radius:3px;flex-shrink:0}
#pinned .pin-pills{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
#pinned .pin-pill{font-size:.67rem;padding:1px 6px;border-radius:3px;
                  background:#f1f3f5;color:#4b5563;border:1px solid #e4e7ed}
#pinned .pin-pill.accepted {background:#eaf7ef;color:#21643a;border-color:#bddfc9}
#pinned .pin-close{margin-left:auto;flex-shrink:0;cursor:pointer;
                   font-size:1rem;color:#9ca3af;line-height:1;
                   padding:0 2px;user-select:none}
#pinned .pin-close:hover{color:#374151}
#pinned .pin-body{padding:10px 13px 13px;overflow-y:auto;flex:1}
#pinned .pin-title{font-size:.85rem;font-weight:600;color:#1c1f26;
                   line-height:1.45;margin-bottom:7px}
#pinned .pin-section{margin-top:9px;padding-top:9px;border-top:1px solid #f0f2f5}
#pinned .pin-section:first-child{margin-top:0;padding-top:0;border-top:none}
#pinned .pin-lbl{font-size:.63rem;font-weight:700;letter-spacing:.08em;
                 text-transform:uppercase;color:#9ca3af;margin-bottom:3px}
#pinned .pin-txt{font-size:.79rem;color:#4b5563;line-height:1.6;white-space:pre-wrap}

/* right summary panel */
.sum-panel{padding:16px;display:flex;flex-direction:column;gap:0}
.sum-panel h2{font-size:.9rem;font-weight:600;margin-bottom:8px;color:#1c1f26}
.sum-label{font-size:.63rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
           color:#8b909e;margin-bottom:6px}
.sum-text{font-size:.81rem;color:#374151;line-height:1.65;white-space:pre-wrap}
.sum-empty{font-size:.82rem;color:#9ca3af;font-style:italic}

/* bottom table tabs */
.table-wrap{max-width:1360px;margin:14px auto 24px;padding:0 18px}
.tab-bar{display:flex;border-bottom:2px solid #e4e7ed;margin-bottom:0}
.tab-btn{border:none;background:none;padding:8px 18px;font-size:.8rem;font-weight:600;
         color:#6b7280;cursor:pointer;border-bottom:2px solid transparent;
         margin-bottom:-2px;transition:color .15s}
.tab-btn.active{color:#3966a2;border-bottom-color:#3966a2}
.tab-btn:hover:not(.active){color:#374151}
.tab-panel{display:none}
.tab-panel.active{display:block}

.node-tbl{width:100%;border-collapse:collapse;background:#fff;
          border:1px solid #dbe5f2;border-radius:0 0 10px 10px;overflow:hidden;
          font-size:.78rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.node-tbl thead tr{background:#f8f9fb;border-bottom:2px solid #dbe5f2}
.node-tbl th{padding:9px 12px;text-align:left;font-size:.66rem;font-weight:700;
             letter-spacing:.07em;text-transform:uppercase;color:#6b7280}
.node-tbl td{padding:8px 12px;border-bottom:1px solid #f0f2f5;color:#374151;
             vertical-align:top}
.node-tbl tr:last-child td{border-bottom:none}
.node-tbl tr:hover td{background:#fafbff}
.tbl-id{font-weight:600;color:#3966a2;white-space:nowrap}
.tbl-mod{white-space:nowrap}
.tbl-pill{display:inline-block;font-size:.66rem;padding:1px 6px;border-radius:3px;
          font-weight:600;white-space:nowrap}
.tbl-biochemical{background:#eaf7ef;color:#21643a;border:1px solid #bddfc9}
.tbl-biology{background:#faece7;color:#993c1d;border:1px solid #f0997b}
.tbl-both{background:#eef4fb;color:#1c3957;border:1px solid #cfe0f2}
.tbl-conf{color:#6b7280;font-size:.74rem}
.tbl-rat{font-size:.76rem;color:#6b7280;line-height:1.55}

/* hypothesis type pills — pinned card + table */
.type-endo {background:#eaf7ef;color:#21643a;border:1px solid #bddfc9}
.type-micro {background:#fff6e6;color:#80551b;border:1px solid #f2d29a}
.type-diet  {background:#eef4fb;color:#3966a2;border:1px solid #cfe0f2}
.type-xeno  {background:#faece7;color:#993c1d;border:1px solid #f0997b}
.type-mixed {background:#eef1f5;color:#44546b;border:1px solid #d7dee7}
.tbl-type{display:inline-block;font-size:.66rem;padding:1px 7px;border-radius:3px;
          font-weight:500;white-space:nowrap;border:1px solid #dbe5f2;
          background:#f1f3f5;color:#4b5563}

@media(max-width:960px){
  .layout{grid-template-columns:1fr}
  .sum-panel{margin-top:0}
  .network-wrap{height:460px;min-height:460px;flex:none}
  .unlinked-group{grid-template-columns:1fr;gap:5px}
}</style>
</head>
<body>

<div class="layout">

  <!-- network -->
  <div class="panel network-panel">
    <div class="toolbar">
      <label><input type="checkbox" id="fBiochemical" checked> Biochemical links</label>
      <label><input type="checkbox" id="fBiology" checked> Biology links</label>
      <label><input type="checkbox" id="fBoth" checked> Both</label>
      <input type="text" id="search" placeholder="Search module, cluster, hypothesis, title&hellip;">
    </div>
    <div class="legend">
      <span><i class="leg-circle" style="background:#667085"></i>Node color&nbsp;&rarr;&nbsp;cluster</span>
      <i class="leg-sep"></i>
      <span>Size&nbsp;&rarr;&nbsp;confidence</span>
      <i class="leg-sep"></i>
      <span><i class="leg-edge-biochem"></i>Biochemical</span>
      <span><i class="leg-edge-biology"></i>Biology</span>
      <span><i class="leg-edge-both"></i>Both</span>
      <i class="leg-sep"></i>
      <div id="cluster-legend"></div>
    </div>
    <div class="network-wrap">
      <svg id="network"><g id="edges"></g><g id="nodes"></g></svg>
      <div id="tooltip"></div>
      <div id="pinned"></div>
    </div>
    <div class="unlinked" id="unlinked" hidden>
      <button class="unlinked-toggle" id="unlinked-toggle" type="button" aria-expanded="false">
        <span>Unlinked hypotheses</span>
        <span class="unlinked-count" id="unlinked-count"></span>
        <span class="unlinked-chevron" aria-hidden="true">&#9662;</span>
      </button>
      <div class="unlinked-body" id="unlinked-body"></div>
    </div>
  </div>

  <!-- summary -->
  <div class="panel sum-panel">
    <div class="sum-label">Integrated Summary</div>
    <div class="sum-text" id="sum-text"></div>
  </div>

</div>

<!-- node / edge tables with tabs -->
<div class="table-wrap">
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="nodes">Nodes</button>
    <button class="tab-btn" data-tab="edges">Edges</button>
  </div>

  <div class="tab-panel active" id="tab-nodes">
    <table class="node-tbl">
      <thead>
        <tr>
          <th>Hypothesis</th>
          <th>Module</th>
          <th>Cluster</th>
          <th>Type</th>
          <th>Confidence</th>
          <th>Title</th>
        </tr>
      </thead>
      <tbody id="tbl-body"></tbody>
    </table>
  </div>

  <div class="tab-panel" id="tab-edges">
    <table class="node-tbl">
      <thead>
        <tr>
          <th>Node 1</th>
          <th>Node 2</th>
          <th>Relation</th>
          <th>Biochemical Evidence</th>
          <th>Biology Rationale</th>
        </tr>
      </thead>
      <tbody id="etbl-body"></tbody>
    </table>
  </div>
</div>

enrichment for indoles and derivatives, and KEGG pathway evidence confirms substantial coverage of tryptophan metabolism. While some top metabolites (e.g., 3-(O-Geranylgeranyl)-sn-glycerol 1-phosphate) have limited pathway context, the dominant biochemical theme is the transformation and conjugation of tryptophan and its indole derivatives.","phenotype_relationship":"Multiple studies indicate that dysregulation of tryptophan metabolism, particularly through the kynurenine pathway, is implicated in the pathogenesis of Alzheimer's disease and other neurodegenerative disorders. Altered tryptophan catabolism produces neuroactive metabolites that can influence neuroinflammation and cognitive function. Additionally, modulation of gut microbiota, which affects tryptophan-derived indole metabolites, has been associated with changes in cognitive performance relevant to Alzheimer's disease. These findings support a relationship between tryptophan metabolism and Alzheimer's disease based on direct evidence from clinical and mechanistic studies.","hypothesis_type":"Host-Endogenous","confidence_label":"high","rationale":"There is strong, coherent module evidence: multiple non-generic, high-priority indole derivatives, class-level enrichment for indoles, and substantial pathway coverage for tryptophan metabolism. The debate record shows that minor concerns about outlier metabolites were transparently addressed and do not detract from the overall biochemical plausibility. Direct PubMed evidence further supports the relevance of tryptophan metabolism to the Alzheimer's disease phenotype.","anchor_metabolites":"N-Acetylisatin; indole-3-acetyl-methionine; indole-3-acetyl-proline; indole-3-glycol; N(6)-[(Indol-3-yl)acetyl]-L-lysine","anchor_metabolite_ids":"InChI=1S/C10H7NO3/c1-6(12)11-8-5-3-2-4-7(8)9(13)10(11)14/h2-5H,1H3; InChI=1S/C15H18N2O3S/c1-21-7-6-13(15(19)20)17-14(18)8-10-9-16-12-5-3-2-4-11(10)12/h2-5,9,13,16H,6-8H2,1H3,(H,17,18)(H,19,20)/p-1; InChI=1S/C15H16N2O3/c18-14(17-7-3 s ribose-5-phosphate for nucleotide synthesis and generates NADPH for reductive biosynthesis and antioxidant defense. While some top metabolites (e.g., N-Succinyl-L-citrulline, 5'-Dehydroadenosine, PQQH2) have limited direct annotation to this pathway, the dominant signal is defined by the nucleoside/nucleotide and sugar phosphate chemistry. Secondary signals from pyrimidine and purine metabolism are expected due to their biochemical integration with the pentose phosphate pathway.","phenotype_relationship":"Multiple studies provide evidence that the pentose phosphate pathway (PPP) is disrupted in Alzheimer's disease (AD), with reduced PPP flux and altered expression of key enzymes such as transaldolase contributing to synaptic dysfunction and neurodegeneration. Metabolites linked to the PPP, including nucleoside and nucleotide derivatives such as deoxyuridine, guanosine, inosine, and cytosine, are implicated in AD through their roles in nucleotide metabolism, oxidative stress response, and neuroinflammation. Dysregulation of these metabolites and related pathways is associated with impaired neuronal bioenergetics, mitochondrial dysfunction, and altered RNA/DNA processing, all of which are central features of AD pathology. Thus, the PPP and its metabolites are closely related to the metabolic and molecular disturbances observed in Alzheimer's disease.","hypothesis_type":"Host-Endogenous","confidence_label":"high","rationale":"There is strong, convergent evidence from metabolite identities, class structure, and pathway coverage supporting the pentose phosphate pathway as the dominant module process. The debate record is clean, with no substantive challenges, and the annotation is consistent with both the biochemical data and the literature-supported phenotype relationship to Alzheimer's disease.","anchor_metabolites":"Deoxyuridine; Guanosine; Inosine; Cytosine","anchor_metabolite_ids":"InChI=1S/C9H12N2O5/c12-4-6-5(13)3-8(16-6)11-2-1-7(14)10-9(11)15/h1-2,5-6,8,12-13H,3 an compounds is supported by literature as being related to mechanisms implicated in Alzheimer's disease.","hypothesis_type":"Diet-Derived","confidence_label":"medium","rationale":"Confidence is medium because, while the top metabolites are biochemically coherent and directly supported by literature as relevant to Alzheimer's disease, there is a lack of corroborating pathway and class-level evidence, and several anchor metabolites are flagged as isolated outliers. The hypothesis is more informative than rejecting the module annotation, but the evidence is not strong enough for high confidence.","anchor_metabolites":"Lignin; Ferulic acid 4-O-sulfate; 3,5-dihydroxy-4-(sulfooxy)benzoic acid; 5,5'-Dehydrodivanillate; (+)-Pinoresinol; Coniferyl alcohol","anchor_metabolite_ids":"InChI=1S/C18H15N3O8S2.2Na/c1-10(22)19-13-7-8-14(30(24,25)26)12-9-15(31(27,28)29)17(18(23)16(12)13)21-20-11-5-3-2-4-6-11;;/h2-9,20H,1H3,(H,19,22)(H,24,25,26)(H,27,28,29);;/q;2*+1/p-2; InChI=1S/C10H10O7S/c1-16-9-6-7(3-5-10(11)12)2-4-8(9)17-18(13,14)15/h2-6H,1H3,(H,11,12)(H,13,14,15)/b5-3+; InChI=1S/C7H6O8S/c8-4-1-3(7(10)11)2-5(9)6(4)15-16(12,13)14/h1-2,8-9H,(H,10,11)(H,12,13,14); InChI=1S/C16H14O8/c1-23-11-5-7(15(19)20)3-9(13(11)17)10-4-8(16(21)22)6-12(24-2)14(10)18/h3-6,17-18H,1-2H3,(H,19,20)(H,21,22); InChI=1S/C20H22O6/c1-23-17-7-11(3-5-15(17)21)19-13-9-26-20(14(13)10-25-19)12-4-6-16(22)18(8-12)24-2/h3-8,13-14,19-22H,9-10H2,1-2H3; InChI=1S/C10H12O3/c1-13-10-7-8(3-2-6-11)4-5-9(10)12/h2-5,7,11-12H,6H2,1H3/b3-2+","top_metabolites":"Lignin; Ferulic acid 4-O-sulfate; 3,5-dihydroxy-4-(sulfooxy)benzoic acid; 5,5'-Dehydrodivanillate; (+)-Pinoresinol; 4-Methylene-L-glutamine; Coniferyl alcohol; all-trans-5-methoxy-2-methyl-3-hexaprenylhydroquinone","top_metabolite_ids":"InChI=1S/C18H15N3O8S2.2Na/c1-10(22)19-13-7-8-14(30(24,25)26)12-9-15(31(27,28)29)17(18(23)16(12)13)21-20-11-5-3-2-4-6-11;;/h2-9,20H,1H3,(H,19,22)(H,24,25,26)(H,27,28,29);;/q;2*+1/p-2; InChI=1S/C10H10O7S/c1-16-9-6-7(3-5-10(11)12)2-4-8(9)17-18 tol-related compounds such as scyllo-inositol and D-chiro-inositol. While some top metabolites have limited direct annotation in canonical pathways, the overall pattern is most consistent with altered inositol phosphate metabolism and related modifications.","phenotype_relationship":"Transcriptome-based metabolic modeling in Alzheimer's disease has identified inositol phosphate metabolism as one of more than 20 metabolic pathways that are dysregulated across multiple AD subtypes. This suggests that alterations in inositol phosphate metabolism are associated with the molecular pathology of Alzheimer's disease.","hypothesis_type":"Host-Endogenous","confidence_label":"low","rationale":"The annotation is anchored in a small set of structurally similar but isolated metabolites without strong pathway or class-level coherence, and several high-ranking metabolites remain unexplained. However, the presence of multiple guanidino-inositol derivatives and direct literature support for inositol phosphate metabolism in Alzheimer's disease justify a low-confidence acceptance as the most plausible available annotation.","anchor_metabolites":"1-Guanidino-1-deoxy-scyllo-inositol 4-phosphate; 1-Guanidino-1-deoxy-scyllo-inositol; 1D-1-Guanidino-1-deoxy-3-dehydro-scyllo-inositol","anchor_metabolite_ids":"InChI=1S/C7H16N3O8P/c8-7(9)10-1-2(11)4(13)6(5(14)3(1)12)18-19(15,16)17/h1-6,11-14H,(H4,8,9,10)(H2,15,16,17)/t1-,2-,3+,4+,5-,6-; InChI=1S/C7H15N3O5/c8-7(9)10-1-2(11)4(13)6(15)5(14)3(1)12/h1-6,11-15H,(H4,8,9,10)/t1-,2-,3+,4+,5-,6-; InChI=1S/C7H13N3O5/c8-7(9)10-1-2(11)4(13)6(15)5(14)3(1)12/h1-4,6,11-13,15H,(H4,8,9,10)/t1-,2-,3+,4+,6-/m0/s1","top_metabolites":"UDP-3-ketoglucose; 1-Guanidino-1-deoxy-scyllo-inositol 4-phosphate; 1-Guanidino-1-deoxy-scyllo-inositol; 5-phospho-beta-D-ribosylaminium(1-); D-Erythro-imidazole-glycerol-phosphate; Cysteic acid; 1D-1-Guanidino-1-deoxy-3-dehydro-scyllo-inositol; Neomycin C","top_metabolite_ids":"InChI=1S/C15H22N2O17P2/c18-3-5-8(20)10(22)12(24)14(32-5) tion rather than a unified metabolic process. The detection of such compounds in CSF is highly unusual and may not represent true endogenous or physiologically relevant metabolism.","phenotype_relationship":"Several studies report that fucoxanthin, a marine-derived carotenoid detected as an exogenous compound in cerebrospinal fluid, exhibits neuroprotective effects in Alzheimer's disease models. Specifically, fucoxanthin has been shown to attenuate amyloid-β-induced carbonyl stress, neuroinflammation, and ferroptosis, and to enhance autophagic flux in cellular and animal models of Alzheimer's disease. These findings suggest a potential beneficial role for fucoxanthin in modulating pathological processes relevant to Alzheimer's disease, though the evidence is primarily preclinical.","hypothesis_type":"Xenobiotic / Exogenous","confidence_label":"medium","rationale":"The module is anchored by several chemically distinctive exogenous compounds (fucoxanthin, fumigaclavine C, isoniazid alpha-ketoglutaric acid), but lacks coherent class or pathway enrichment and contains multiple isolated outlier metabolites. The revised hypothesis accurately reflects this partial and indirect evidence, providing a plausible and useful annotation without over-interpreting the findings. Confidence is not high due to the absence of strong pathway/class support and the possibility of analytical artifacts, but the annotation remains informative.","anchor_metabolites":"Fucoxanthin; Fumigaclavine C; Isoniazid alpha-ketoglutaric acid","anchor_metabolite_ids":"InChI=1S/C42H58O6/c1-29(18-14-19-31(3)22-23-37-38(6,7)26-35(47-33(5)43)27-40(37,10)46)16-12-13-17-30(2)20-15-21-32(4)36(45)28-42-39(8,9)24-34(44)25-41(42,11)48-42/h12-22,34-35,44,46H,24-28H2,1-11H3/b13-12+,18-14+,20-15+,29-16+,30-17+,31-19+,32-21+; InChI=1S/C23H30N2O2/c1-7-23(4,5)22-16-11-18-20(15-9-8-10-17(24-22)19(15)16)21(27-14(3)26)13(2)12-25(18)6/h7-10,13,18,20-21,24H,1,11-12H2,2-6H3/t13-,18-,20-,21+/m1/s1; InChI=1S/C11H11N3O5/c15-9(16) nal_summary":"This module is anchored by several metabolites central to glyoxylate and dicarboxylate metabolism, including oxalic acid, oxalyl-CoA, and oxamate. Oxalic acid is a key end-product of glyoxylate metabolism, while oxalyl-CoA is an activated intermediate in the conversion of glyoxylate to oxalate. Oxamate is a structural analog of oxaloacetate and can act as an inhibitor of enzymes in this pathway, further supporting the module's focus on dicarboxylate transformations. The presence of malyl-CoA and related carboxylic acids suggests additional flux through TCA cycle intermediates and anaplerotic reactions. While glycocholate and aminopentol are present among the top metabolites, their roles are less directly connected to the core glyoxylate/dicarboxylate pathway and may reflect secondary or cross-pathway processes. Overall, the module is best explained by dysregulation of glyoxylate and dicarboxylate metabolism, with supporting evidence from both metabolite anchors and pathway coverage.","phenotype_relationship":"Several studies using Alzheimer's disease models, including APP/PS1 mice and human neural stem cell constructs, have identified alterations in glyoxylate and dicarboxylate metabolism or its metabolites in association with AD-related pathology and cognitive impairment. Metabolomic analyses in these models revealed changes in pathways involving oxalic acid and related dicarboxylates, suggesting a link between dysregulation of this metabolic pathway and AD phenotypes. However, most evidence is derived from animal or in vitro models, and direct mechanistic connections in human cerebrospinal fluid are not explicitly described in the abstracts.","hypothesis_type":"Host-Endogenous","confidence_label":"high","rationale":"There is strong, convergent evidence from top metabolites, chemical class structure, and pathway coverage supporting the annotation. The debate process was uncontentious, with no valid challenges raised. While some tension metabolites exi  and derivatives, as well as organooxygen compounds, which are typical of nicotine biotransformation products. Pathway evidence from KEGG and HMDB strongly supports the assignment to nicotine metabolism, with substantial module coverage. Secondary signals such as Caldariellaquinone and Blue pigment are present but do not conflict with the central nicotine metabolism theme.","phenotype_relationship":"Direct PubMed evidence linking nicotine metabolism or its metabolites to Alzheimer's disease in human cerebrospinal fluid is lacking. The available literature discusses nicotine metabolism in the context of nicotine dependence, cardiovascular risk, and neurochemical changes, but does not address Alzheimer's disease specifically. Therefore, any relationship between nicotine metabolism and Alzheimer's disease must be considered mechanistic and inferred rather than directly supported by phenotype-specific evidence.","hypothesis_type":"Xenobiotic / Exogenous","confidence_label":"high","rationale":"There is strong module evidence for nicotine metabolism: multiple non-generic, pathway-specific metabolites are present as top features, class structure is coherent, and pathway coverage is substantial. The debate process led to a focused and well-supported annotation, with all minor issues resolved. The annotation is biologically plausible and specific to the observed data.","anchor_metabolites":"2,6-Dihydroxypseudooxynicotine; nicotine-glucuronide","anchor_metabolite_ids":"InChI=1S/C10H14N2O3/c1-11-6-2-3-8(13)7-4-5-9(14)12-10(7)15/h4-5,11H,2-3,6H2,1H3,(H2,12,14,15); InChI=1S/C16H22N2O6/c1-17-6-3-5-10(17)9-4-2-7-18(8-9)15-13(21)11(19)12(20)14(24-15)16(22)23/h2,4,7-8,10-15,19-21H,3,5-6H2,1H3/p+1/t10-,11-,12-,13+,14-,15-/m0/s1","top_metabolites":"2,6-Dihydroxypseudooxynicotine; Caldariellaquinone; nicotine-glucuronide; N-Formylmaleamic acid; Blue pigment; cotinine methonium ion","top_metabolite_ids":"InChI=1S/C10H14N2O3/c1-11-6-2-3-8(13)7-4-5-9(14)12-10(7)15/h4-5,11H,2-3,6H2,1H3,(H2 . While polyamine-related metabolites such as 1,3-diaminopropane and carboxynorspermidine are present, they are interpreted as secondary features reflecting intersecting nitrogen metabolism rather than primary drivers of the module. The top two metabolites, bis(glutathionyl)spermine and glutathionylspermine, remain unexplained by the dominant pathway and are considered tension metabolites, possibly representing cross-pathway conjugation or redox-related modifications unrelated to histidine metabolism in cerebrospinal fluid.","phenotype_relationship":"Several studies using metabolomics approaches in Alzheimer's disease models have identified alterations in histidine metabolism associated with cognitive impairment. Interventions that ameliorate AD-related cognitive deficits, such as Cistanche deserticola polysaccharides or combined luteolin and exercise treatment, have been shown to modulate histidine metabolism pathways, suggesting a relationship between histidine metabolic changes and AD pathology or symptom improvement.","hypothesis_type":"Host-Endogenous","confidence_label":"medium","rationale":"Confidence is medium because, while the core histidine metabolism annotation is strongly supported by anchor metabolites, class structure, pathway coverage, and direct Alzheimer's disease literature, the presence of unexplained, highly abundant tension metabolites (bis(glutathionyl)spermine and glutathionylspermine) introduces unresolved ambiguity. The hypothesis is more informative than rejecting the annotation, but the unexplained outliers preclude high confidence.","anchor_metabolites":"N-Acetylhistidine; L-histidinol-phosphate","anchor_metabolite_ids":"InChI=1S/C8H11N3O3/c1-5(12)11-7(8(13)14)2-6-3-9-4-10-6/h3-4,7H,2H2,1H3,(H,9,10)(H,11,12)(H,13,14)/t7-/m0/s1; InChI=1S/C6H12N3O4P/c7-5(3-13-14(10,11)12)1-6-2-8-4-9-6/h2,4-5H,1,3,7H2,(H,8,9)(H2,10,11,12)/t5-/m0/s1","top_metabolites":"Bis(glutathionyl)spermine; Glutathionylspermine; 1,3-Diaminopropane; N-Acetylhistidine; L- etabolites are products of phase II conjugative metabolism, primarily catalyzed by UDP-glucuronosyltransferases and UDP-glucosyltransferases, which attach glucuronic acid or glucose to a wide range of substrates to increase their solubility and facilitate excretion. The presence of steroidal (digoxin), flavonoid, isoflavonoid, and saccharolipid conjugates further supports a broad role for conjugation in the metabolism of both endogenous signaling molecules and xenobiotics. Pathway evidence from KEGG (pentose and glucuronate interconversions, amino sugar and nucleotide sugar metabolism) and HMDB (morphine and artemether metabolism) is consistent with this interpretation. While some top metabolites (e.g., Calenduloside E, Soyasapogenol A, Sativan) have limited pathway context, their occurrence as glycosides or glucuronides fits within the overall theme of conjugative metabolism.","phenotype_relationship":"Insufficient literature evidence to establish phenotype relationship.","hypothesis_type":"Host-Endogenous","confidence_label":"high","rationale":"There is strong convergence across multiple lines of evidence: non-generic top metabolites (multiple glucuronide/glucoside conjugates), coherent chemical class structure, pathway context, and a plausible biochemical mechanism. The debate record is clean, with no substantive challenges or unresolved tensions. While some outlier metabolites lack direct pathway context, their occurrence as glycosides or glucuronides is consistent with the overall theme, and does not undermine the main annotation.","anchor_metabolites":"Dihydrozeatin-O-glucoside; 3-Methoxy-4-hydroxyphenylglycol glucuronide; 3',5'-Diiodo-L-thyronine-beta-D-glucuronoside; Trichloroethanol glucuronide","anchor_metabolite_ids":"InChI=1S/C16H25N5O6/c1-8(2-3-17-14-10-15(19-6-18-10)21-7-20-14)5-26-16-13(25)12(24)11(23)9(4-22)27-16/h6-9,11-13,16,22-25H,2-5H2,1H3,(H2,17,18,19,20,21)/t8?,9-,11-,12+,13-,16-/m1/s1; InChI=1S/C15H20O10/c1-23-9-4-6(7(17)5-16)2-3-8(9)24-15-12( resentation of fatty acyls and robust pathway coverage for linoleic and alpha-linolenic acid metabolism support a mechanism involving the absorption and possible CNS presence of plant- or diet-derived oxylipins. While plant jasmonates are detected, their role is likely as dietary xenobiotics rather than as central metabolic intermediates in humans. Secondary signals from flavonoids and isoflavonoids may reflect broader plant metabolite intake but do not define the main pathway.","phenotype_relationship":"Multiple studies indicate that oxylipins, including 13-HODE and 12,13-EpOME, are altered in the context of Alzheimer's disease and related cognitive impairment. Specifically, reductions in brain esterified pro-resolving oxylipins have been observed in transgenic animal models of Alzheimer's disease, suggesting deficits in inflammation resolution pathways. Additionally, disruptions in linoleic acid-derived oxylipins are associated with cognitive decline in populations at risk for dementia. These findings support a relationship between oxylipin metabolism and Alzheimer's disease pathology.","hypothesis_type":"Diet-Derived","confidence_label":"high","rationale":"There is strong convergence of evidence: non-generic, biochemically distinctive top metabolites (13-HODE, 12,13-EpOME), dominant fatty acyl class structure, and high pathway coverage for relevant oxylipin-generating pathways. The debate process resolved all major challenges, and direct PubMed evidence links oxylipin metabolism to Alzheimer's disease, further supporting the annotation.","anchor_metabolites":"13-HODE; 12,13-EpOME","anchor_metabolite_ids":"InChI=1S/C18H32O3/c1-2-3-11-14-17(19)15-12-9-7-5-4-6-8-10-13-16-18(20)21/h7,9,12,15,17,19H,2-6,8,10-11,13-14,16H2,1H3,(H,20,21)/b9-7-,15-12+/t17-/m0/s1; InChI=1S/C18H32O3/c1-2-3-10-13-16-17(21-16)14-11-8-6-4-5-7-9-12-15-18(19)20/h8,11,16-17H,2-7,9-10,12-15H2,1H3,(H,19,20)/b11-8-","top_metabolites":"N-Jasmonoylisoleucine; 1,8-Dihydroxy-3-methylnaphthalene; N-Meth const svg    = document.getElementById("network");
const gEdges = document.getElementById("edges");
const gNodes = document.getElementById("nodes");
const tooltip = document.getElementById("tooltip");
const pinned  = document.getElementById("pinned");
const search  = document.getElementById("search");
const controls = {
  biochemical: document.getElementById("fBiochemical"),
  biology:     document.getElementById("fBiology"),
  both:        document.getElementById("fBoth")
};
let pinnedNode = null;
let activeCluster = null;
let unlinkedOpen = false;

/* ── colour / size maps ── */
const PALETTE = [
  "#3966a2","#519d9e","#c1602e","#2f9e6a",
  "#b5892f","#7a5ea0","#4a7c8c","#a24a6b",
  "#5c8a3f","#8a5a3f","#3f6b8a","#6b6f4a"
];
const UNCLUSTERED = "Unclustered";
const clusterId = n => (n.cluster_id && n.cluster_id.trim()) ? n.cluster_id : UNCLUSTERED;
const naturalCollator = new Intl.Collator(undefined, {numeric: true, sensitivity: "base"});
function clusterCompare(a, b){
  if (a === UNCLUSTERED) return b === UNCLUSTERED ? 0 : 1;
  if (b === UNCLUSTERED) return -1;
  return naturalCollator.compare(a, b);
}
const clusterRows = data.clusters || [];
const clusterTheme = Object.fromEntries(
  clusterRows.map(c => [c.cluster_id, c.cluster_theme || c.cluster_id])
);
const clusterIds = [...new Set(data.nodes.map(clusterId))]
  .sort(clusterCompare);
const clusterColor = Object.fromEntries(
  clusterIds.map((c, i) => [c, c === UNCLUSTERED ? "#667085" : PALETTE[i % PALETTE.length]])
);
const SIZE = {high: 17, medium: 13, low: 10};
const DEF_SIZE = 12;

function nodeSize(n) { return SIZE[n.confidence_label] || DEF_SIZE; }
function nodeColor(n){ return clusterColor[clusterId(n)] || "#667085"; }
function edgeType(e){ return e.relation_type || e.relation_class || ""; }

/* ── cluster colour legend ── */
const clusterLeg = document.getElementById("cluster-legend");
clusterIds.forEach(c => {
  const sp = document.createElement("button");
  sp.type = "button";
  sp.className = "cluster-filter";
  sp.dataset.cluster = c;
  const label = c === UNCLUSTERED ? c : `${c}: ${clusterTheme[c] || c}`;
  sp.innerHTML = `<i class="cluster-dot" style="background:${clusterColor[c]}"></i>${esc(label)}`;
  sp.addEventListener("click", () => {
    activeCluster = activeCluster === c ? null : c;
    document.querySelectorAll(".cluster-filter").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.cluster === activeCluster);
      btn.classList.toggle("dimmed", activeCluster && btn.dataset.cluster !== activeCluster);
    });
    render();
    renderUnlinked();
  });
  clusterLeg.appendChild(sp);
});

/* ── node / edge data ── */
let nodes = data.nodes.map(d => ({...d, x: 0, y: 0}));
const nodeById = Object.fromEntries(nodes.map(d => [d.node_id, d]));
let edges = data.edges
  .map(e => ({...e, source: nodeById[e.node_1], target: nodeById[e.node_2]}))
  .filter(e => e.source && e.target);
const structurallyConnectedIds = new Set();
edges.forEach(e => {
  structurallyConnectedIds.add(e.node_1);
  structurallyConnectedIds.add(e.node_2);
});
nodes.forEach(n => { n.isIsolated = !structurallyConnectedIds.has(n.node_id); });

/* ── helpers ── */
function esc(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function typeCls(t){
  if (!t) return "";
  const tl = t.toLowerCase();
  if (tl.includes("host") && tl.includes("microbiome")) return "type-mixed";
  if (tl.includes("microbiome") || tl.includes("microbial"))  return "type-micro";
  if (tl.includes("diet") || tl.includes("food"))             return "type-diet";
  if (tl.includes("xenobiotic") || tl.includes("exogenous"))  return "type-xeno";
  if (tl.includes("endogenous") || tl.includes("host"))       return "type-endo";
  return "";
}

function filters(){
  return {
    biochemical: controls.biochemical.checked,
    biology:     controls.biology.checked,
    both:        controls.both.checked,
    q: search.value.trim().toLowerCase()
  };
}

function nodeVisible(n, f){
  if (f.q){
    const hay = [n.node_id,n.module_id,n.hypothesis_id,n.hypothesis_type,
                 n.cluster_id,n.title,n.functional_summary,n.phenotype_relationship]
                .join(" ").toLowerCase();
    if (!hay.includes(f.q)) return false;
  }
  return true;
}

function edgeVisible(e, visIds, f){
  if (!visIds.has(e.node_1) || !visIds.has(e.node_2)) return false;
  const t = edgeType(e);
  if (t === "biochemical") return f.biochemical;
  if (t === "biology")     return f.biology;
  if (t === "both")        return f.both;
  return false;
}

/* ── hit test: all nodes are circles ── */
function isOver(n, mx, my){
  const sz = nodeSize(n);
  const dx = n.x - mx, dy = n.y - my;
  return dx*dx + dy*dy <= sz*sz;
}

/* ── hit test: point-to-segment distance for edge tooltips ── */
function ptSegDist(px, py, x1, y1, x2, y2){
  const dx = x2-x1, dy = y2-y1;
  const lenSq = dx*dx + dy*dy;
  if (lenSq === 0) return Math.hypot(px-x1, py-y1);
  const t = Math.max(0, Math.min(1, ((px-x1)*dx + (py-y1)*dy) / lenSq));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}

/* ── hover tooltip — title only, follows mouse, no pointer-events ── */
function showTooltip(ev, n){
  tooltip.textContent = n.title || n.node_id;
  tooltip.style.display = "block";
  positionTooltip(ev);
}

function positionTooltip(ev){
  const wrap = document.querySelector(".network-wrap");
  const r    = wrap.getBoundingClientRect();
  let tx = ev.clientX - r.left + 14;
  let ty = ev.clientY - r.top  - 30;
  if (tx + 270 > wrap.offsetWidth) tx = ev.clientX - r.left - 270;
  if (ty < 4) ty = ev.clientY - r.top + 14;
  tooltip.style.left = Math.max(4, tx) + "px";
  tooltip.style.top  = Math.max(4, ty) + "px";
}

/* ── pinned card — click to open, scrollable ── */
function pinSection(label, text){
  if (!text || !text.trim()) return "";
  return `<div class="pin-section">
    <div class="pin-lbl">${esc(label)}</div>
    <div class="pin-txt">${esc(text)}</div>
  </div>`;
}

function showPin(ev, n){
  pinnedNode = n.node_id;
  const confLabel = n.confidence_label ? n.confidence_label + " confidence" : "";
  const cl = clusterId(n);
  const clLabel = cl === UNCLUSTERED ? cl : `${cl}: ${clusterTheme[cl] || cl}`;
  pinned.innerHTML =
    `<div class="pin-hdr">
       <div>
         <span class="pin-id">${esc(n.node_id)}</span>
         <div class="pin-pills">
           ${confLabel ? `<span class="pin-pill">${esc(confLabel)}</span>` : ""}
           <span class="pin-pill">${esc(clLabel)}</span>
           ${n.hypothesis_type ? `<span class="pin-pill ${typeCls(n.hypothesis_type)}">${esc(n.hypothesis_type)}</span>` : ""}
         </div>
       </div>
       <span class="pin-close" id="pin-close-btn">&#x2715;</span>
     </div>
     <div class="pin-body">
       ${n.title ? `<div class="pin-title">${esc(n.title)}</div>` : ""}
       ${pinSection("Functional summary", n.functional_summary)}
     </div>`;

  /* position near node */
  const wrap = document.querySelector(".network-wrap");
  const wW = wrap.offsetWidth, wH = wrap.offsetHeight;
  const cardW = 270, cardH = Math.min(280, wH - 20);
  let px = n.isIsolated ? wW - cardW - 12 : n.x + nodeSize(n) + 10;
  let py = n.isIsolated ? 12 : n.y - 60;
  if (px + cardW > wW - 8) px = n.x - nodeSize(n) - cardW - 10;
  if (py + cardH > wH - 8) py = wH - cardH - 8;
  if (py < 8) py = 8;
  if (px < 8) px = 8;

  pinned.style.left    = px + "px";
  pinned.style.top     = py + "px";
  pinned.style.display = "flex";

  /* close button */
  document.getElementById("pin-close-btn")
    .addEventListener("click", ev2 => { ev2.stopPropagation(); hidePin(); });
}

function hidePin(){
  pinnedNode = null;
  pinned.style.display = "none";
  render();
}

/* ── SVG-level mouse tracking (survives DOM re-renders every tick) ── */
svg.addEventListener("mousemove", ev => {
  const r  = svg.getBoundingClientRect();
  const mx = ev.clientX - r.left;
  const my = ev.clientY - r.top;
  const f  = filters();
  const vis    = nodes.filter(n => !n.isIsolated && nodeVisible(n, f));
  const visIds = new Set(vis.map(n => n.node_id));
  let hit = null;
  for (let i = vis.length - 1; i >= 0; i--) {
    if (isOver(vis[i], mx, my)) { hit = vis[i]; break; }
  }
  if (hit && hit.node_id !== pinnedNode) {
    /* node hover: show title */
    showTooltip(ev, hit);
  } else if (!hit) {
    /* edge hover: find nearest visible edge within 6px */
    const visE = edges.filter(e => edgeVisible(e, visIds, f));
    let hitEdge = null;
    for (const e of visE) {
      if (ptSegDist(mx, my,
                    e.source.x, e.source.y,
                    e.target.x, e.target.y) < 6) {
        hitEdge = e; break;
      }
    }
    if (hitEdge) {
      tooltip.textContent = edgeType(hitEdge);
      tooltip.style.display = "block";
      positionTooltip(ev);
    } else {
      tooltip.style.display = "none";
    }
  } else {
    tooltip.style.display = "none";
  }
});

svg.addEventListener("mouseleave", () => {
  tooltip.style.display = "none";
});

/* click on SVG background dismisses pin */
svg.addEventListener("click", ev => {
  const r  = svg.getBoundingClientRect();
  const mx = ev.clientX - r.left;
  const my = ev.clientY - r.top;
  const f  = filters();
  const vis = nodes.filter(n => !n.isIsolated && nodeVisible(n, f));
  const hit = vis.find(n => isOver(n, mx, my));
  if (hit) {
    tooltip.style.display = "none";
    showPin(ev, hit);
    render();  /* re-render to highlight selected node */
  } else {
    hidePin();
  }
});

/* ── static layout ── */
function connectedComponents(connectedNodes){
  const adjacency = new Map(connectedNodes.map(n => [n.node_id, []]));
  edges.forEach(e => {
    adjacency.get(e.node_1)?.push(e.node_2);
    adjacency.get(e.node_2)?.push(e.node_1);
  });

  const visited = new Set();
  const components = [];
  connectedNodes
    .slice()
    .sort((a, b) => naturalCollator.compare(a.node_id, b.node_id))
    .forEach(start => {
      if (visited.has(start.node_id)) return;
      const queue = [start.node_id];
      const component = [];
      visited.add(start.node_id);
      while (queue.length){
        const id = queue.shift();
        component.push(nodeById[id]);
        (adjacency.get(id) || []).forEach(next => {
          if (!visited.has(next)){
            visited.add(next);
            queue.push(next);
          }
        });
      }
      components.push(component);
    });

  return components.sort((a, b) =>
    b.length - a.length || naturalCollator.compare(a[0].node_id, b[0].node_id)
  );
}

function componentCentres(count, x, y, width, height){
  if (count <= 0) return [];
  const cols = count === 1
    ? 1
    : Math.min(count, Math.max(1, Math.ceil(Math.sqrt(count * width / Math.max(height, 1)))));
  const rows = Math.ceil(count / cols);
  const cellW = width / cols;
  const cellH = height / rows;
  return Array.from({length: count}, (_, i) => ({
    x: x + (i % cols + 0.5) * cellW,
    y: y + (Math.floor(i / cols) + 0.5) * cellH
  }));
}

function computeLayout(){
  const rect = svg.getBoundingClientRect();
  const W = rect.width || 860;
  const H = rect.height || 560;
  const connectedNodes = nodes.filter(n => !n.isIsolated);
  const components = connectedComponents(connectedNodes);
  const compactW = Math.min(W - 40, Math.max(500, W * 0.80));
  const compactH = Math.min(H - 36, Math.max(360, H * 0.78));
  const originX = (W - compactW) / 2;
  const originY = (H - compactH) / 2;
  const centres = componentCentres(components.length, originX, originY, compactW, compactH);

  components.forEach((component, ci) => {
    const cx = centres[ci].x;
    const cy = centres[ci].y;
    const radius = Math.min(72, Math.max(38, 24 + component.length * 7));

    component.forEach((n, i) => {
      const angle = 2 * Math.PI * i / component.length - Math.PI / 2;
      const spread = component.length === 2 ? 48 : radius;
      n.x = component.length === 2 ? cx + (i === 0 ? -spread : spread) : cx + spread * Math.cos(angle);
      n.y = component.length === 2 ? cy : cy + spread * Math.sin(angle);
      n.layoutComponent = ci;
    });
  });

  /* Global relaxation prevents neighbouring components and labels from colliding. */
  for (let iter = 0; iter < 320; iter++){
    for (let i = 0; i < connectedNodes.length; i++){
      for (let j = i + 1; j < connectedNodes.length; j++){
        const a = connectedNodes[i], b = connectedNodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        const absX = Math.abs(dx), absY = Math.abs(dy);
        const minX = nodeSize(a) + nodeSize(b) + 64;
        const minY = nodeSize(a) + nodeSize(b) + 22;
        if (absX < minX && absY < minY){
          const overlapX = minX - absX;
          const overlapY = minY - absY;
          if (overlapX < overlapY){
            const dir = dx === 0 ? (i % 2 === 0 ? -1 : 1) : Math.sign(dx);
            const push = overlapX * 0.26;
            a.x += dir * push;
            b.x -= dir * push;
          } else {
            const dir = dy === 0 ? (i % 2 === 0 ? -1 : 1) : Math.sign(dy);
            const push = overlapY * 0.26;
            a.y += dir * push;
            b.y -= dir * push;
          }
        }
      }
    }

    edges.forEach(e => {
      const a = e.source, b = e.target;
      let dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      const target = edgeType(e) === "both" ? 88 : 110;
      const pull = (d - target) * 0.032;
      dx /= d; dy /= d;
      a.x += dx * pull; a.y += dy * pull;
      b.x -= dx * pull; b.y -= dy * pull;
    });

    connectedNodes.forEach(n => {
      const centre = centres[n.layoutComponent];
      n.x += (centre.x - n.x) * 0.0035;
      n.y += (centre.y - n.y) * 0.0035;
      const pad = nodeSize(n) + 18;
      n.x = Math.max(originX + pad, Math.min(originX + compactW - pad - 54, n.x));
      n.y = Math.max(originY + pad, Math.min(originY + compactH - pad, n.y));
    });
  }
}

/* ── render ── */
function render(){
  const f      = filters();
  const vis    = nodes.filter(n => !n.isIsolated && nodeVisible(n, f));
  const visIds = new Set(vis.map(n => n.node_id));
  const visE   = edges.filter(e => edgeVisible(e, visIds, f));

  /* edges */
  gEdges.innerHTML = "";
  for (const e of visE){
    const line = document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1", e.source.x); line.setAttribute("y1", e.source.y);
    line.setAttribute("x2", e.target.x); line.setAttribute("y2", e.target.y);
    line.setAttribute("class", `edge ${edgeType(e)}`);
    if (activeCluster){
      const sourceMatch = clusterId(e.source) === activeCluster;
      const targetMatch = clusterId(e.target) === activeCluster;
      line.setAttribute("opacity", sourceMatch && targetMatch ? 1 : sourceMatch || targetMatch ? 0.32 : 0.07);
    }
    gEdges.appendChild(line);
  }

  /* nodes */
  gNodes.innerHTML = "";
  for (const n of vis){
    const grp = document.createElementNS("http://www.w3.org/2000/svg","g");
    grp.setAttribute("class", "node");
    grp.setAttribute("transform", `translate(${n.x},${n.y})`);
    if (activeCluster && clusterId(n) !== activeCluster) grp.setAttribute("opacity", 0.16);

    const sz   = nodeSize(n);
    const fill = nodeColor(n);
    let shape;

    shape = document.createElementNS("http://www.w3.org/2000/svg","circle");
    shape.setAttribute("r", sz);
    const isPinned = n.node_id === pinnedNode;
    shape.setAttribute("fill", fill);
    shape.setAttribute("stroke", isPinned ? "#1c1f26" : "#fff");
    shape.setAttribute("stroke-width", isPinned ? "3.5" : "2.5");

    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x", sz + 4);
    t.setAttribute("y", 4);
    t.textContent = n.node_id;

    grp.appendChild(shape);
    grp.appendChild(t);
    gNodes.appendChild(grp);
  }
}

/* ── compact index for hypotheses without relationships ── */
function renderUnlinked(){
  const wrap = document.getElementById("unlinked");
  const body = document.getElementById("unlinked-body");
  const count = document.getElementById("unlinked-count");
  const toggle = document.getElementById("unlinked-toggle");
  const f = filters();
  const allUnlinked = nodes.filter(n => n.isIsolated);
  const visibleUnlinked = allUnlinked.filter(n => nodeVisible(n, f));

  wrap.hidden = allUnlinked.length === 0;
  if (allUnlinked.length === 0) return;

  const searchOpen = Boolean(f.q);
  wrap.classList.toggle("open", unlinkedOpen || searchOpen);
  toggle.setAttribute("aria-expanded", String(unlinkedOpen || searchOpen));
  count.textContent = f.q
    ? `${visibleUnlinked.length} of ${allUnlinked.length}`
    : String(allUnlinked.length);
  body.innerHTML = "";

  clusterIds.forEach(id => {
    const groupNodes = visibleUnlinked
      .filter(n => clusterId(n) === id)
      .sort((a, b) => naturalCollator.compare(a.node_id, b.node_id));
    if (groupNodes.length === 0) return;

    const group = document.createElement("div");
    group.className = "unlinked-group";

    const cluster = document.createElement("div");
    cluster.className = "unlinked-cluster";
    cluster.innerHTML =
      `<i class="cluster-dot" style="background:${clusterColor[id]}"></i>` +
      `<span>${esc(id === UNCLUSTERED ? id : `${id}: ${clusterTheme[id] || id}`)}</span>`;

    const nodeList = document.createElement("div");
    nodeList.className = "unlinked-nodes";
    groupNodes.forEach(n => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "unlinked-node";
      if (activeCluster && clusterId(n) !== activeCluster) button.classList.add("dimmed");
      button.title = n.title || n.node_id;
      button.setAttribute("aria-label", `${n.node_id}: ${n.title || "Unlinked hypothesis"}`);

      const dot = document.createElement("i");
      const dotSize = Math.max(7, Math.round(nodeSize(n) * 0.62));
      dot.className = "unlinked-node-dot";
      dot.style.width = dotSize + "px";
      dot.style.height = dotSize + "px";
      dot.style.background = nodeColor(n);

      const label = document.createElement("span");
      label.textContent = n.node_id;
      button.appendChild(dot);
      button.appendChild(label);
      button.addEventListener("click", ev => {
        ev.stopPropagation();
        showPin(ev, n);
      });
      nodeList.appendChild(button);
    });

    group.appendChild(cluster);
    group.appendChild(nodeList);
    body.appendChild(group);
  });
}

/* ── node table ── */
const tbody = document.getElementById("tbl-body");
[...nodes]
  .sort((a, b) => clusterCompare(clusterId(a), clusterId(b)) ||
    naturalCollator.compare(a.node_id, b.node_id))
  .forEach(n => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td class="tbl-id">${esc(n.node_id)}</td>` +
      `<td class="tbl-mod">${esc(n.module_id)}</td>` +
      `<td class="tbl-mod">${esc(clusterId(n))}</td>` +
      `<td><span class="tbl-type ${typeCls(n.hypothesis_type)}">${esc(n.hypothesis_type || "—")}</span></td>` +
      `<td class="tbl-conf">${esc(n.confidence_label || "—")}</td>` +
      `<td>${esc(n.title || "—")}</td>`;
    tbody.appendChild(tr);
  });

/* ── edge table ── */
const etbody = document.getElementById("etbl-body");
data.edges.forEach(e => {
  const tr = document.createElement("tr");
  const rel = edgeType(e);
  const pillCls = rel === "both" ? "tbl-both" :
    rel === "biochemical" ? "tbl-biochemical" : "tbl-biology";
  tr.innerHTML =
    `<td class="tbl-id">${esc(e.node_1)}</td>` +
    `<td class="tbl-id">${esc(e.node_2)}</td>` +
    `<td><span class="tbl-pill ${pillCls}">${esc(rel)}</span></td>` +
    `<td class="tbl-rat">${esc(e.biochemical_evidence_detail || "—")}</td>` +
    `<td class="tbl-rat">${esc(e.biology_rationale || "—")}</td>`;
  etbody.appendChild(tr);
});

/* ── tab switching ── */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
  });
});

/* ── summary ── */
const sumEl = document.getElementById("sum-text");
if (data.summary && data.summary.trim()) {
  sumEl.textContent = data.summary;
} else {
  sumEl.innerHTML = `<span class="sum-empty">No integrated summary available.</span>`;
}

/* ── wire controls ── */
for (const el of Object.values(controls)) el.addEventListener("change", render);
for (const el of Object.values(controls)) {
  el.addEventListener("change", renderUnlinked);
}
search.addEventListener("input", () => {
  render();
  renderUnlinked();
});
document.getElementById("unlinked-toggle").addEventListener("click", () => {
  unlinkedOpen = !unlinkedOpen;
  renderUnlinked();
});

window.addEventListener("load", function(){
  computeLayout();
  render();
  renderUnlinked();
});</script>
</body>
</html>
